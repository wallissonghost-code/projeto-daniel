name: Import clean solo base

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-clean-base.yml'

permissions:
  contents: write

jobs:
  import-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caos-Live2
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout source Caos Live
        uses: actions/checkout@v4
        with:
          repository: wallissonghost-code/Game
          ref: main
          path: source

      - name: Copy source without legacy CI
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            source/ target/

      - name: Remove legacy/multiplayer/cosmetic payload
        shell: bash
        run: |
          cd target
          rm -rf .ci .ci-trigger
          rm -f duo.html duo-server.html multiplayer.html multiplayer-v2.html skin-test-local.html
          rm -f src/duo.js src/duo-server.js src/duo-server-game.js
          rm -f src/multiplayer-entry.js src/multiplayer.js src/multiplayer-v2.js
          rm -rf assets/mobs assets/player assets/player-armed assets/bosses
          rm -f docs/multiplayer-decisions.md
          rm -f cloud/game-server.mjs cloud/game-server-v2.mjs cloud/game-server-v3.mjs

          # Keep only runtime/validation scripts that belong to the clean base.
          if [ -d scripts ]; then
            find scripts -maxdepth 1 -type f \
              ! -name 'tiktok-bridge.mjs' \
              ! -name 'check-game.mjs' \
              ! -name 'check-architecture.mjs' \
              ! -name 'audit-runtime.mjs' \
              ! -name 'check-natural-events.mjs' \
              ! -name 'smoke-menu.mjs' \
              ! -name 'gameplay-bot.mjs' \
              ! -name 'ghost-aim-bot.mjs' \
              ! -name 'progression-bot.mjs' \
              -delete
          fi

      - name: Apply solo/admin cleanup
        shell: python
        run: |
          from pathlib import Path
          import json, re
          root = Path('target')

          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<div id="duoMini".*?</div>', '', s, flags=re.S)
          s = re.sub(r'<button id="multiplayerBtn".*?</button>', '', s, flags=re.S)
          s = re.sub(r'<section id="multiplayerWake".*?</section>', '', s, flags=re.S)
          s = re.sub(r'<a class="btn" id="duoInviteBtn".*?</a>', '', s, flags=re.S)
          s = s.replace('<small style="display:block;margin-bottom:12px">O mesmo código conecta ADM e P2.</small>', '')
          s = re.sub(r'<button id="rankDuoBtn".*?</button>', '', s, flags=re.S)
          s = s.replace('Player + Pose Armada + Weapon em PNG direto', 'Base solo otimizada')
          p.write_text(s, encoding='utf-8')

          p = root / 'src/core/game-bootstrap.mjs'
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'\n\s*await loadClassic\(`src/multiplayer-entry\.js[^\n]*\);', '', s)
              p.write_text(s, encoding='utf-8')

          p = root / 'src/core/skills-bootstrap.mjs'
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace("if(player.down||(choosing&&duoPlayer.connected))return false;", "if(player.down||choosing)return false;")
              p.write_text(s, encoding='utf-8')

          # Admin remains complete, but every game command is now solo-only.
          p = root / 'src/panel.js'
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r"if\(d\.players&&\$\('playerTarget'\)\)\{.*?\}\}", '', s, flags=re.S)
              s = s.replace("target:$('playerTarget')?.value||'p1'", "target:'p1'")
              p.write_text(s, encoding='utf-8')

          p = root / 'painel.html'
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<option value="p2"[^>]*>.*?</option>', '', s, flags=re.S)
              s = s.replace('P1 · HOST', 'PLAYER').replace('PLAYER 1', 'PLAYER')
              p.write_text(s, encoding='utf-8')

          pkg = json.loads((root/'package.json').read_text(encoding='utf-8'))
          scripts = pkg.setdefault('scripts', {})
          for key in list(scripts):
              if key.startswith('game-server'):
                  scripts.pop(key, None)
          pkg['name'] = 'caos-live2'
          (root/'package.json').write_text(json.dumps(pkg, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          (root/'version.json').write_text(json.dumps({
              'version':'0.1.0',
              'source':'wallissonghost-code/Game',
              'mode':'solo-clean',
              'admin':'full'
          }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          for rel in ['index.html', 'src/core/game-bootstrap.mjs']:
              text = (root/rel).read_text(encoding='utf-8').lower()
              forbidden = ['multiplayer-entry.js', 'multiplayerbtn', 'duoinvitebtn', 'duomini']
              bad = [x for x in forbidden if x in text]
              if bad:
                  raise SystemExit(f'{rel}: forbidden runtime references remain: {bad}')

      - name: Validate clean boundary
        shell: bash
        run: |
          cd target
          test -f index.html
          test -f painel.html
          test -f src/game.js
          test -f src/panel.js
          test -f cloud/connector-server.mjs
          test ! -e multiplayer.html
          test ! -e duo.html
          test ! -e assets/player
          test ! -e assets/mobs
          test ! -e assets/bosses
          test ! -e cloud/game-server-v2.mjs
          test ! -e cloud/game-server-v3.mjs
          test ! -e .ci
          test ! -e .ci-trigger
          ! grep -RIl --exclude-dir=.git -E 'src/(multiplayer|duo)(-entry|-server|-v2)?\.js' index.html src/core 2>/dev/null | grep -q .

      - name: Commit imported clean base
        shell: bash
        run: |
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import optimized solo game base with full admin'
          git push origin main
