services:
  - type: web
    name: projeto-daniel-live-connector
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: LIVE_CONNECTOR_KEY
        sync: false
      - key: SIGN_API_KEY
        sync: false
